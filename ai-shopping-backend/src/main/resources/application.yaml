server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/aishop_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ─── JPA 설정 ─────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update   # 개발용 (운영에서는 validate or none)
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  # ─── Redis 설정 ───────────────────────────
  data:
    redis:
      host: localhost
      port: 6379

  # ─── Security 기본 설정 ───────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: your-client-id
            client-secret: your-client-secret
            scope:
              - profile
              - email

# ─── MyBatis 설정 ───────────────────────────
mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.aishop.domain
  configuration:
    map-underscore-to-camel-case: true

# ─── 로그 설정 ─────────────────────────────
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
    com.aishop: debug

# ─── 커스텀 설정 (AI 서버 연동용) ───────────
ai:
  server:
    url: http://localhost:8000
  anomaly:
    threshold: 0.8