################################
#  공통 설정 (모든 환경에서 사용)
################################

spring:
  profiles:
    active: local   # 기본 실행 환경 (절대 prod 금지)
  application:
    name: aishop    # 애플리케이션 이름

# ─── MyBatis 공통 설정 ─────────────────────
mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.aishop.backend.domain
  configuration:
    map-underscore-to-camel-case: true   # DB snake_case → Java camelCase 자동 변환

# ─── JWT 설정 (공통) ───────────────────────
jwt:
  accsecret: ${JWT_ACCSECRET:local-access-secret}
  refsecret: ${JWT_REFSECRET:local-refresh-secret}
  access-token-expiration: 1800000      # 30분
  refresh-token-expiration: 604800000   # 7일

# ─── AI 서버 공통 설정 ─────────────────────
ai:
  anomaly:
    threshold: 0.8   # 이상 탐지 임계값

# ─── Swagger/OpenAPI 설정 ─────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
